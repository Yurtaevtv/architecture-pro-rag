services:
  chromadb:
    image: chromadb/chroma:latest  # Более новая версия с ARM поддержкой
    platform: linux/arm64
    container_name: chromadb-server
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
      - ALLOW_RESET=TRUE
      - CHROMA_SERVER_CORS_ALLOW_ORIGINS=['*']
    restart: unless-stopped
    networks:
      - rag-network

  chromadb_admin:
    image: fengzhichao/chromadb-admin
    container_name: chromadb_viewer
    ports: 
      - 8001:3001
    environment:
      - CHROMA_SERVER_URL=http://chromadb:8000
    depends_on:
      - chromadb
    networks:
      - rag-network

  ofelia:
    image: mcuadros/ofelia:latest
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    labels:
      ofelia.job-exec.ingestor.schedule: "0 * * * *" 
      ofelia.job-exec.ingestor.container: "rag-ingestor"
      ofelia.job-exec.ingestor.command: "python /app/base_ingestor.py"
    networks:
      - rag-network


  ingestor:
    build:
      context: ./ingestor
      platforms:
        - linux/arm64     
    container_name: rag-ingestor
    volumes:
      - ./ingestor/knowledge_base:/app/source_docs
      - ./ingestor/system:/app/system
    depends_on:
      - chromadb
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - COLLECTION_NAME=documents      
      - EMBEDDING_MODEL=LaBSE
      - CHUNK_SIZE=500
      - CHUNK_OVERLAP=50
      - SOURCE_DIR=/app/source_docs
      - STAT_FILE=/app/system/stat_file.json
    command: tail -f /dev/null
    restart: unless-stopped
    networks:
      - rag-network

  # api:
  #   build:
  #     context: ./rag_api
  #   container_name: rag-api
  #   env_file: "./rag_api/.env"
  #   ports: 
  #     - 10001:10001
  #   depends_on:
  #     - chromadb
  #   command: python -u app.py
  #   networks:
  #     - rag-network
    

volumes:
  chroma-data:
    driver: local

networks:
  rag-network:
    driver: bridge